<style>/* Nelyqor — feuille de styles unique (design system). */

:root {
  --bg: #0F1720;
  --surface: #161F2B;
  --surface-2: #1C2735;
  --surface-glass: rgba(22, 31, 43, 0.92);
  --teal: #2ED3B7;
  --teal-soft: rgba(var(--accent-rgb), 0.14);
  --teal-ink: #062A23;
  --blue: #78A6FF;
  --blue-soft: rgba(120, 166, 255, 0.14);
  --text: #F5F7FA;
  --muted: #9AA4B2;
  --border: rgba(255, 255, 255, 0.07);
  --border-strong: rgba(255, 255, 255, 0.12);
  --danger: #FF8A80;
  --danger-soft: rgba(255, 138, 128, 0.12);
  --warn: #FFC46B;
  --warn-soft: rgba(255, 196, 107, 0.12);

  --r-lg: 22px;
  --r-md: 16px;
  --r-sm: 12px;
  --gap: 14px;
  --nav-h: 64px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --max-w: 560px;

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--bg); touch-action: manipulation; overscroll-behavior-y: none; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
img { display: block; max-width: 100%; }
.num { font-variant-numeric: tabular-nums; }
.wrap { overflow-wrap: anywhere; }
.muted { color: var(--muted); }
.teal { color: var(--teal); }
.danger-text { color: var(--danger); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

/* ---------- Structure ---------- */
.bg-layer {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-color: var(--bg);
  transition: opacity .4s ease;
}
.screen {
  position: relative; z-index: 1;
  max-width: var(--max-w);
  margin: 0 auto;
  padding: calc(var(--safe-top) + 16px) 16px calc(var(--nav-h) + var(--safe-bottom) + 32px);
  display: flex; flex-direction: column; gap: var(--gap);
}
.screen.no-nav { padding-bottom: calc(var(--safe-bottom) + 28px); min-height: 100dvh; }

/* ---------- Logo ---------- */
.logo { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
.logo-mark { border-radius: 24%; overflow: hidden; flex: none; box-shadow: 0 0 0 1px rgba(var(--accent-rgb), 0.25), 0 6px 18px rgba(0, 0, 0, 0.35); background: #062b1f; }
.logo-mark img { width: 100%; height: 100%; object-fit: cover; }
.logo-word { font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; }
.logo-word .q { color: var(--teal); }

/* ---------- En-têtes ---------- */
.top-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.page-head { display: flex; flex-direction: column; gap: 4px; }
.page-title { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.page-sub { color: var(--muted); }
.today-line { color: var(--muted); font-size: 14px; }
.quote {
  font-size: 18px; font-weight: 600; line-height: 1.35; letter-spacing: -0.01em;
  color: var(--text);
}
.section-title { font-size: 17px; font-weight: 650; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.back-btn { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--muted); padding: 8px 0; min-height: 44px; cursor: pointer; }
.back-btn:active { color: var(--text); }

/* ---------- Cartes ---------- */
.card {
  background: var(--surface-glass);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 18px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  display: flex; flex-direction: column; gap: 12px;
  min-width: 0;
}
.card.accent { background: linear-gradient(160deg, rgba(var(--accent-rgb), 0.10), rgba(22, 31, 43, 0.94) 45%); border-color: rgba(var(--accent-rgb), 0.18); }
.card.premium { background: linear-gradient(160deg, rgba(120, 166, 255, 0.10), rgba(22, 31, 43, 0.94) 50%); border-color: rgba(120, 166, 255, 0.20); }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card-title { font-size: 16px; font-weight: 650; }
.card-sub { color: var(--muted); font-size: 13.5px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

.amount-xl { font-size: clamp(26px, 8.4vw, 36px); font-weight: 750; letter-spacing: -0.02em; line-height: 1.1; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.amount-lg { font-size: clamp(22px, 6.6vw, 28px); font-weight: 700; letter-spacing: -0.015em; line-height: 1.15; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.amount-md { font-size: 18px; font-weight: 650; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.pct-big { font-size: 22px; font-weight: 750; color: var(--teal); font-variant-numeric: tabular-nums; white-space: nowrap; }

.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: var(--r-md); padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat-label { font-size: 12.5px; color: var(--muted); line-height: 1.3; }
.stat-value { font-size: 17px; font-weight: 650; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; line-height: 1.25; }
.stat-note { font-size: 12px; color: var(--muted); }

.rows { display: flex; flex-direction: column; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 14px; padding: 10px 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
.rows .row:first-child { border-top: 0; padding-top: 2px; }
.row-label { color: var(--muted); flex: 1 1 140px; min-width: 0; }
.row-value { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; margin-left: auto; }

/* ---------- Barre de progression ---------- */
.progress { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
.progress > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, color-mix(in srgb, var(--teal) 78%, #000), var(--teal)); transition: width .5s ease; }
.progress.blue > span { background: linear-gradient(90deg, #5b8de8, var(--blue)); }

/* ---------- Chips / badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: rgba(255, 255, 255, 0.06); color: var(--muted); white-space: nowrap; }
.badge.teal { background: var(--teal-soft); color: var(--teal); }
.badge.blue { background: var(--blue-soft); color: var(--blue); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

.notice { border-radius: var(--r-md); padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
.notice.success { background: var(--teal-soft); color: var(--text); border: 1px solid rgba(var(--accent-rgb), 0.3); }
.notice.warn { background: var(--warn-soft); border: 1px solid rgba(255, 196, 107, 0.35); }
.notice.danger { background: var(--danger-soft); border: 1px solid rgba(255, 138, 128, 0.35); }
.notice.info { background: var(--blue-soft); border: 1px solid rgba(120, 166, 255, 0.3); }
.notice svg { flex: none; margin-top: 1px; }
.notice strong { display: block; }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 12px 18px; border-radius: 14px;
  font-weight: 650; font-size: 15.5px; line-height: 1.2; text-align: center;
  border: 1px solid transparent; cursor: pointer; width: 100%;
  transition: transform .08s ease, filter .15s ease, background .15s ease, opacity .15s;
  -webkit-user-select: none; user-select: none;
}
.btn:active:not(:disabled) { transform: scale(0.98); filter: brightness(0.92); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--teal); color: var(--teal-ink); box-shadow: 0 8px 22px rgba(var(--accent-rgb), 0.22); }
.btn-secondary { background: transparent; border-color: var(--border-strong); color: var(--text); }
.btn-ghost { background: rgba(255, 255, 255, 0.04); color: var(--text); }
.btn-blue { background: var(--blue); color: #0b1a33; }
.btn-danger { background: transparent; border-color: rgba(255, 138, 128, 0.45); color: var(--danger); }
.btn-sm { min-height: 40px; padding: 8px 14px; font-size: 14px; width: auto; border-radius: 12px; }
.btn-link { background: none; border: 0; color: var(--teal); font-weight: 600; padding: 8px 4px; min-height: 40px; cursor: pointer; font-size: 14px; }
.btn-stack { display: flex; flex-direction: column; gap: 10px; }

/* ---------- Listes d'opérations ---------- */
.op-list { display: flex; flex-direction: column; }
.op {
  display: flex; align-items: center; gap: 12px; padding: 12px 4px;
  border-top: 1px solid var(--border); background: none; border-left: 0; border-right: 0; border-bottom: 0;
  width: 100%; text-align: left; cursor: pointer; min-height: 60px;
}
.op:first-child { border-top: 0; }
.op:active { background: rgba(255, 255, 255, 0.03); }
.op-icon { width: 38px; height: 38px; border-radius: 12px; flex: none; display: grid; place-items: center; }
.op-icon.revenue { background: var(--teal-soft); color: var(--teal); }
.op-icon.transfer { background: var(--blue-soft); color: var(--blue); }
.op-icon.withdrawal { background: var(--danger-soft); color: var(--danger); }
.op-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.op-label { font-weight: 600; overflow-wrap: anywhere; line-height: 1.3; }
.op-date { font-size: 13px; color: var(--muted); }
.op-amount { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; flex: none; max-width: 48%; overflow-wrap: anywhere; }
.op-amount small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.op-amount.pos { color: var(--teal); }
.op-amount.neg { color: var(--danger); }

.empty { text-align: center; padding: 18px 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty-icon { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.05); color: var(--muted); }
.empty p { color: var(--muted); max-width: 300px; }
.empty .btn { width: auto; }

/* ---------- Navigation basse ---------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  padding-bottom: var(--safe-bottom);
  background: rgba(13, 20, 28, 0.94);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-top: 1px solid var(--border);
}
.nav-inner { max-width: var(--max-w); margin: 0 auto; height: var(--nav-h); display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.nav-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  background: none; border: 0; color: var(--muted); cursor: pointer; min-width: 0; padding: 6px 2px;
  font-size: 11px; font-weight: 600;
}
.nav-item .nav-ico { width: 40px; height: 28px; border-radius: 999px; display: grid; place-items: center; transition: background .2s; }
.nav-item.active { color: var(--teal); }
.nav-item.active .nav-ico { background: var(--teal-soft); }
.nav-item span.nav-label { white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: clip; }
@media (max-width: 400px) { .nav-item { font-size: 10px; } }
@media (max-width: 340px) { .nav-item { font-size: 9px; } .nav-item .nav-ico { width: 34px; } }

/* ---------- Segments, toggles, champs ---------- */
.segmented { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 6px; padding: 5px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border); border-radius: 14px; }
.segmented button { min-height: 44px; border-radius: 10px; border: 0; background: none; color: var(--muted); font-weight: 650; cursor: pointer; padding: 6px 4px; }
.segmented button[aria-pressed="true"] { background: var(--teal); color: var(--teal-ink); }
.segmented.small button { min-height: 38px; font-size: 14px; }

.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .field-label { font-weight: 600; font-size: 14.5px; }
.field-hint { color: var(--muted); font-size: 13px; }
.field-error { color: var(--danger); font-size: 13.5px; }
.input-wrap { position: relative; display: flex; align-items: center; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-strong); border-radius: 14px; transition: border-color .15s; }
.input-wrap:focus-within { border-color: var(--teal); }
.input-wrap.invalid { border-color: var(--danger); }
.input-wrap input { flex: 1; min-width: 0; background: none; border: 0; outline: none; padding: 14px 16px; min-height: 52px; font-size: 17px; }
.input-wrap input::placeholder { color: rgba(154, 164, 178, 0.55); }
.input-wrap .suffix { padding-right: 16px; color: var(--muted); font-weight: 600; }
.input-wrap.big input { font-size: 26px; font-weight: 700; min-height: 64px; }
.input-wrap input[type="date"] { color-scheme: dark; }

.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-top: 1px solid var(--border); }
.switch-row:first-child { border-top: 0; }
.switch-row .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.switch { position: relative; width: 52px; height: 32px; border-radius: 999px; border: 0; background: rgba(255, 255, 255, 0.14); cursor: pointer; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--teal); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }

.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day-chip { min-height: 48px; border-radius: 12px; border: 1px solid var(--border-strong); background: rgba(255, 255, 255, 0.03); color: var(--muted); font-weight: 650; font-size: 13px; cursor: pointer; padding: 4px 0; }
.day-chip[aria-pressed="true"] { background: var(--teal-soft); border-color: var(--teal); color: var(--teal); }
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border); border-radius: 14px; padding: 8px; }
.stepper button { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--border-strong); background: none; font-size: 22px; cursor: pointer; }
.stepper button:disabled { opacity: 0.35; }
.stepper .value { text-align: center; flex: 1; min-width: 0; }
.stepper .value strong { display: block; font-size: 26px; line-height: 1.1; }
.stepper .value span { color: var(--muted); font-size: 13px; }

/* ---------- Calcul aperçu (formulaire revenu) ---------- */
.preview { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: var(--r-md); padding: 6px 14px; }

/* ---------- Feuilles (bottom sheets) ---------- */
.sheet-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(4, 8, 12, 0.6); backdrop-filter: blur(2px); animation: fade .2s ease; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; margin: 0 auto; max-width: var(--max-w);
  max-height: calc(100dvh - var(--safe-top) - 16px);
  overflow-y: auto; overscroll-behavior: contain;
  background: #121B26; border: 1px solid var(--border-strong); border-bottom: 0;
  border-radius: 24px 24px 0 0;
  padding: 10px 18px calc(var(--safe-bottom) + 22px);
  display: flex; flex-direction: column; gap: 16px;
  animation: up .25s cubic-bezier(.2, .8, .2, 1);
}
.sheet-grip { width: 40px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.18); align-self: center; flex: none; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.sheet-title { font-size: 20px; font-weight: 700; line-height: 1.25; }
.icon-btn { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 12px; border: 0; background: rgba(255, 255, 255, 0.06); color: var(--muted); cursor: pointer; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 70;
  bottom: calc(var(--nav-h) + var(--safe-bottom) + 14px);
  background: #1F2B3A; border: 1px solid rgba(var(--accent-rgb), 0.35); color: var(--text);
  padding: 11px 16px; border-radius: 14px; font-weight: 600; font-size: 14.5px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); display: flex; gap: 8px; align-items: center;
  max-width: calc(100vw - 32px); animation: up .2s ease;
}
.toast svg { color: var(--teal); flex: none; }

/* ---------- Graphique ---------- */
.chart-wrap { width: 100%; }
.chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart-axis { fill: var(--muted); font-size: 10.5px; }

/* ---------- Profil ---------- */
.profile-head { display: flex; align-items: center; gap: 14px; }
.avatar { width: 60px; height: 60px; border-radius: 50%; flex: none; display: grid; place-items: center; overflow: hidden; font-size: 24px; font-weight: 750; color: var(--teal); background: linear-gradient(150deg, rgba(var(--accent-rgb), 0.22), rgba(120, 166, 255, 0.12)); border: 1px solid rgba(var(--accent-rgb), 0.3); }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar-btn { margin-left: auto; padding: 3px; border: 0; background: none; border-radius: 50%; cursor: pointer; min-width: 44px; min-height: 44px; display: grid; place-items: center; }
.avatar-btn:active { transform: scale(0.96); }
.avatar-edit { position: relative; padding: 0; border: 0; background: none; cursor: pointer; flex: none; border-radius: 50%; }
.avatar-cam { position: absolute; right: -2px; bottom: -2px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--teal); color: var(--teal-ink); border: 2px solid var(--surface); }
.profile-name { font-size: 22px; font-weight: 700; overflow-wrap: anywhere; line-height: 1.2; }
.menu { display: flex; flex-direction: column; padding: 6px 0; }
.menu-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: none; border: 0; border-top: 1px solid var(--border); text-align: left; cursor: pointer; min-height: 60px; width: 100%; }
.menu-item:first-child { border-top: 0; }
.menu-item:active { background: rgba(255, 255, 255, 0.03); }
.menu-ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.05); color: var(--teal); flex: none; }
.menu-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.menu-txt strong { font-weight: 600; }
.menu-txt span { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.chev { color: var(--muted); flex: none; }

/* ---------- Offres (onboarding / Nelyqor+) ---------- */
.plan { border-radius: var(--r-lg); padding: 18px; border: 1px solid var(--border-strong); background: var(--surface); display: flex; flex-direction: column; gap: 12px; }
.plan.plus { border-color: rgba(var(--accent-rgb), 0.45); background: linear-gradient(165deg, rgba(var(--accent-rgb), 0.12), var(--surface) 55%); box-shadow: 0 12px 34px rgba(var(--accent-rgb), 0.08); }
.plan-name { font-size: 20px; font-weight: 750; }
.plan-price { font-size: 15.5px; font-weight: 650; color: var(--teal); line-height: 1.4; }
.checklist { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.checklist li { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; line-height: 1.4; }
.checklist li svg { flex: none; color: var(--teal); margin-top: 2px; }

/* ---------- Onboarding ---------- */
.ob { display: flex; flex-direction: column; gap: 22px; flex: 1; }
.ob-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; }
.ob-steps { display: flex; gap: 6px; }
.ob-steps i { width: 22px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.12); }
.ob-steps i.on { background: var(--teal); }
.ob-q { font-size: clamp(24px, 7vw, 30px); font-weight: 750; letter-spacing: -0.02em; line-height: 1.2; }
.ob-body { display: flex; flex-direction: column; gap: 18px; }
.ob-actions { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }

.milestones { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.sim-result { display: flex; flex-direction: column; gap: 6px; }

@media (min-width: 400px) { .screen { padding-left: 18px; padding-right: 18px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Formulaires génériques ---------- */
.form-stack { display: flex; flex-direction: column; gap: 16px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 auto; }
.input-action { flex: none; background: none; border: 0; color: var(--teal); font-weight: 600; font-size: 14px; padding: 0 14px; min-height: 44px; cursor: pointer; }
.segmented.wrap-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.ob-login { display: flex; flex-direction: column; align-items: flex-start; gap: 0; padding-top: 6px; border-top: 1px solid var(--border); }

/* ---------- Pastilles (dossiers) ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border-strong); background: rgba(255, 255, 255, 0.03); color: var(--muted); font-weight: 600; font-size: 14px; cursor: pointer; max-width: 100%; overflow-wrap: anywhere; }
.chip[aria-pressed="true"] { background: var(--teal-soft); border-color: var(--teal); color: var(--teal); }
.chip.add { border-style: dashed; color: var(--teal); }

/* ---------- Dossiers et dépenses prévues ---------- */
.folders { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.folder { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px; border-radius: var(--r-md); border: 1px solid var(--border); background: rgba(255, 255, 255, 0.03); cursor: pointer; text-align: left; min-width: 0; }
.folder:active { background: rgba(255, 255, 255, 0.06); }
.folder-ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--teal-soft); color: var(--teal); margin-bottom: 4px; }
.folder-name { font-weight: 650; overflow-wrap: anywhere; line-height: 1.25; }
.folder-amount { font-weight: 700; font-variant-numeric: tabular-nums; }
.folder-meta { font-size: 12px; color: var(--muted); }
.op-icon.planned { background: var(--warn-soft); color: var(--warn); }
.card.due { border-color: rgba(255, 196, 107, 0.35); background: linear-gradient(160deg, rgba(255, 196, 107, 0.10), rgba(22, 31, 43, 0.94) 50%); }
.due-item { display: flex; flex-direction: column; gap: 10px; padding-top: 12px; border-top: 1px solid var(--border); }
.due-item:first-of-type { border-top: 0; padding-top: 0; }

/* ---------- Couleur principale ---------- */
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 10px; }
.swatch { position: relative; aspect-ratio: 1; min-height: 48px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; display: grid; place-items: center; box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.25); }
.swatch[aria-checked="true"] { border-color: var(--text); box-shadow: 0 0 0 3px var(--bg) inset; }
.swatch.custom { background: conic-gradient(#F87171, #FACC15, #4ADE80, #2ED3B7, #60A5FA, #A78BFA, #F472B6, #F87171); color: #0F1720; overflow: hidden; }
.swatch.custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.swatch.custom svg { background: rgba(255, 255, 255, 0.85); border-radius: 50%; padding: 4px; box-sizing: content-box; }

/* ---------- Connexion ---------- */
.btn-provider { background: #fff; color: #111; border-color: #fff; }
.btn-provider.apple { background: #000; color: #fff; border-color: rgba(255, 255, 255, 0.28); }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--border-strong); }

/* ---------- Adaptation automatique : tablettes et ordinateurs ---------- */
@media (min-width: 700px) {
  :root { --max-w: 720px; }
  body { font-size: 16px; }
  .screen { padding-left: 24px; padding-right: 24px; }
  .folders { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .milestones { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .sheet { border-radius: 24px; bottom: 16px; max-height: calc(100dvh - 32px); border-bottom: 1px solid var(--border-strong); }
}
@media (min-width: 1100px) {
  :root { --max-w: 1040px; }
  /* Deux colonnes de cartes, en-tête et notifications sur toute la largeur. */
  .screen:not(.no-nav) { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
  .screen:not(.no-nav) > :is(header, .page-head, .top-bar, .notice, .btn, .back-btn, .page-title, .grid-2) { grid-column: 1 / -1; }
  .screen.no-nav { max-width: 640px; }
  .milestones { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (orientation: landscape) and (max-height: 500px) {
  :root { --nav-h: 56px; }
  .nav-item .nav-label { font-size: 10px; }
}

/* ---------- Calendrier ---------- */
.cal { display: flex; flex-direction: column; gap: 10px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal-title { font-size: 17px; font-weight: 700; text-align: center; flex: 1; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal-wd span { text-align: center; font-size: 12px; font-weight: 650; color: var(--muted); }
.cal-day { position: relative; aspect-ratio: 1; min-height: 40px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255, 255, 255, 0.02); color: var(--muted); font-weight: 650; font-size: 14.5px; cursor: pointer; display: grid; place-items: center; padding: 0; font-variant-numeric: tabular-nums; }
.cal-day.work { background: var(--teal-soft); border-color: rgba(var(--accent-rgb), 0.35); color: var(--text); }
.cal-day.extra { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.25); }
.cal-day.rest { background: var(--warn-soft); border: 1px dashed rgba(255, 196, 107, 0.6); color: var(--warn); }
.cal-day.rest .cal-num { text-decoration: line-through; }
.cal-day.today { outline: 2px solid var(--text); outline-offset: 1px; }
.cal-day.past { opacity: 0.55; }
.cal-day.after { opacity: 0.35; }
.cal-dot { position: absolute; bottom: 4px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--blue); }
.cal-sum { font-size: 14px; color: var(--muted); }
.cal-sum strong { color: var(--text); }
.cal-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.lg.work { background: var(--teal-soft); border: 1px solid rgba(var(--accent-rgb), 0.35); }
.lg.extra { background: var(--teal); }
.lg.rest { background: var(--warn-soft); border: 1px dashed rgba(255, 196, 107, 0.6); }
.lg.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
.cal-pad { aspect-ratio: 1; }

/* ---------- Micro-entreprise ---------- */
.micro-bar { display: flex; flex-direction: column; gap: 6px; }
.micro-row { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.micro-row strong { color: var(--text); }
.progress.near > span { background: linear-gradient(90deg, #e6a94a, var(--warn)); }
.progress.over > span { background: linear-gradient(90deg, #e2675d, var(--danger)); }

/* ---------- Rythme par jour de la semaine ---------- */
.wk { display: flex; flex-direction: column; gap: 8px; }
.wk-row { display: grid; grid-template-columns: 82px minmax(0, 1fr) 150px; align-items: center; gap: 10px; font-size: 14px; }
.wk-day { color: var(--muted); }
.wk-bar { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.06); overflow: hidden; }
.wk-bar i { display: block; height: 100%; border-radius: 99px; background: var(--teal); }
.wk-val { font-weight: 650; text-align: right; white-space: nowrap; }
</style>
</head>
