# Nelyqor Trading — PHASE 4 : exécution (transactions publiques + carnets), rotation, régime, IA secondaire,
# dimensionnement. API PUBLIQUE Bitvavo uniquement : aucune clé, aucun ordre, aucune base de production.
# Calcul à la demande (push sur claude/** ou manuel) : ce n'est PAS un serveur permanent.
name: nelyqor-research-p4

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["nelyqor-trading/scripts/research_phase4.py", "nelyqor-trading/backend/research/lob_sim.py",
            "nelyqor-trading/scripts/collect_microstructure.py",
            "nelyqor-trading/backend/research/xsection_v2.py", ".github/workflows/nelyqor-research-p4.yml"]

permissions:
  contents: read

concurrency:
  group: nelyqor-research-p4-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: nelyqor-trading

env:
  NELYQOR_MARKET_DATA: data/market

jobs:
  donnees:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: nelyqor-trading/requirements.lock}
      - run: pip install -r requirements.lock
      - uses: actions/cache/restore@v4
        with: {path: nelyqor-trading/data/market, key: "bitvavo-market-v1-${{ github.run_id }}", restore-keys: bitvavo-market-v1-}
      - uses: actions/cache/restore@v4
        with: {path: nelyqor-trading/data/micro, key: "bitvavo-micro-v1-${{ github.run_id }}", restore-keys: bitvavo-micro-v1-}
      - name: Bougies 1 h (incrémental, marchés manquants, budget 15 min)
        run: python scripts/download_candles.py --universe --quotes EUR,USDC --interval 1h --days 1100 --time-budget 900 --pause 0.02 || echo "code=$?"
      - name: Transactions publiques historiques (14 jours, 10 marchés liquides, budget 20 min)
        run: python scripts/collect_microstructure.py history --days 14 --time-budget 1200 || echo "code=$?"
      - name: Carnets + transactions en direct (15 min, toutes les 10 s)
        run: python scripts/collect_microstructure.py live --minutes 15 --every 10 || echo "code=$?"
      - name: Volume
        run: du -sh data/market data/micro || true
      - uses: actions/cache/save@v4
        if: always()
        with: {path: nelyqor-trading/data/market, key: "bitvavo-market-v1-${{ github.run_id }}"}
      - uses: actions/cache/save@v4
        if: always()
        with: {path: nelyqor-trading/data/micro, key: "bitvavo-micro-v1-${{ github.run_id }}"}

  recherche:
    needs: donnees
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - {part: decomp, intervals: "1h,4h,1d"}
          - {part: lobsim, intervals: "4h"}
          - {part: rotation, intervals: "1h,2h,4h"}
          - {part: rotation, intervals: "8h,12h,1d"}
          - {part: regime, intervals: "1h,4h,1d"}
          - {part: ai, intervals: "4h"}
          - {part: sizing, intervals: "1h,4h,1d"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: nelyqor-trading/requirements.lock}
      - run: pip install -r requirements.lock
      - uses: actions/cache/restore@v4
        with: {path: nelyqor-trading/data/market, key: "bitvavo-market-v1-${{ github.run_id }}", fail-on-cache-miss: true}
      - uses: actions/cache/restore@v4
        with: {path: nelyqor-trading/data/micro, key: "bitvavo-micro-v1-${{ github.run_id }}"}
      - name: Recherche phase 4 (${{ matrix.part }} ${{ matrix.intervals }})
        run: python scripts/research_phase4.py --part ${{ matrix.part }} --intervals ${{ matrix.intervals }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "phase4-${{ matrix.part }}-${{ strategy.job-index }}", path: nelyqor-trading/reports-ci, retention-days: 30}
