# Nelyqor Trading — collecte quotidienne de MICROSTRUCTURE publique (carnets + transactions) CENTRÉE sur les marchés
# réellement sélectionnés par les candidats figés v3 (phase 5, priorité 6). API publique, aucune clé, aucun ordre.
# Les données restent dans le cache GitHub Actions (jamais commitées) ; couverture publiée en artefact.
name: nelyqor-microstructure

on:
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["nelyqor-trading/scripts/select_micro_markets.py", ".github/workflows/nelyqor-microstructure.yml"]

permissions:
  contents: read

concurrency:
  group: nelyqor-microstructure
  cancel-in-progress: false

defaults:
  run:
    working-directory: nelyqor-trading

env:
  NELYQOR_MARKET_DATA: data/market

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: nelyqor-trading/requirements.lock}
      - run: pip install -r requirements.lock
      - uses: actions/cache/restore@v4
        with: {path: nelyqor-trading/data/market, key: "bitvavo-market-v1-${{ github.run_id }}", restore-keys: bitvavo-market-v1-}
      - uses: actions/cache/restore@v4
        with: {path: nelyqor-trading/data/micro, key: "micro-v1-${{ github.run_id }}", restore-keys: micro-v1-}
      - uses: actions/cache/restore@v4
        with: {path: nelyqor-trading/data/prospective, key: "prospective-v1-${{ github.run_id }}", restore-keys: prospective-v1-}
      - name: Marchés sélectionnés par les candidats v3
        id: sel
        run: |
          python scripts/select_micro_markets.py --days 90 --max 20 | tee ../selection.log
          echo "marches=$(tail -n1 ../selection.log)" >> "$GITHUB_OUTPUT"
      - name: Transactions publiques (3 derniers jours, budget 15 min)
        env: {MARCHES: "${{ steps.sel.outputs.marches }}"}
        run: python scripts/collect_microstructure.py history --markets "$MARCHES" --days 3 --time-budget 900 || echo "::warning::collecte incomplète (code $?)"
      - name: Carnets + transactions en direct (10 min, toutes les 15 s)
        env: {MARCHES: "${{ steps.sel.outputs.marches }}"}
        run: python scripts/collect_microstructure.py live --markets "$MARCHES" --minutes 10 --every 15 || echo "::warning::collecte en direct incomplète (code $?)"
      - name: Couverture
        run: du -sh data/micro && cp data/micro/selection.json ../ 2>/dev/null || true
      - uses: actions/cache/save@v4
        if: always()
        with: {path: nelyqor-trading/data/micro, key: "micro-v1-${{ github.run_id }}"}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: selection-microstructure, path: selection.json, retention-days: 30}
