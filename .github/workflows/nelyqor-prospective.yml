# Nelyqor Trading — évaluation PROSPECTIVE périodique des candidats figés (API publique, aucune clé, aucun ordre).
# ATTENTION : les déclenchements planifiés (schedule) ne s'exécutent que lorsque ce fichier est présent sur la
# branche PAR DÉFAUT du dépôt (règle GitHub). Avant fusion, seuls les push ci-dessous le déclenchent.
# Ce n'est PAS une exécution continue : une évaluation par jour, journal conservé en cache + artefact (90 j).
name: nelyqor-prospective

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["nelyqor-trading/reports/prospective/candidats_figes.json", ".github/workflows/nelyqor-prospective.yml"]

permissions:
  contents: read

concurrency:
  group: nelyqor-prospective
  cancel-in-progress: false

defaults:
  run:
    working-directory: nelyqor-trading

env:
  NELYQOR_MARKET_DATA: data/market

jobs:
  evaluer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: nelyqor-trading/requirements.lock}
      - run: pip install -r requirements.lock
      - uses: actions/cache/restore@v4
        with:
          path: nelyqor-trading/data/market
          key: bitvavo-market-v1-${{ github.run_id }}
          restore-keys: bitvavo-market-v1-
      - uses: actions/cache/restore@v4
        with:
          path: nelyqor-trading/data/prospective
          key: prospective-v1-${{ github.run_id }}
          restore-keys: prospective-v1-
      - name: Mise à jour incrémentale (1 h, EUR + USDC)
        run: python scripts/download_candles.py --universe --quotes EUR,USDC --interval 1h --days 1100 --time-budget 2400 --pause 0.02 || echo "code=$?"
      - name: Évaluation des candidats figés
        run: python scripts/prospective.py run
      - uses: actions/cache/save@v4
        if: always()
        with: {path: nelyqor-trading/data/market, key: "bitvavo-market-v1-${{ github.run_id }}"}
      - uses: actions/cache/save@v4
        if: always()
        with: {path: nelyqor-trading/data/prospective, key: "prospective-v1-${{ github.run_id }}"}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: journal-prospectif, path: nelyqor-trading/data/prospective, retention-days: 90}
