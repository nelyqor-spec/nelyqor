# Nelyqor Trading — PRÉ-REMPLISSAGE des bougies publiques (API publique Bitvavo, aucune clé, aucun ordre).
# À lancer À LA MAIN sur la branche par défaut juste APRÈS la fusion de la PR n° 1, AVANT la première évaluation
# prospective : les caches GitHub d'une branche de fonctionnalité ne sont pas visibles depuis la branche par défaut.
# Sans historique complet (≈ 3 ans, ≈ 430 marchés), les candidats figés seraient calculés sur des données tronquées
# et le rejeu exact de v3 / E1 divergerait (évaluation INVALIDE). Incrémental : relancer jusqu'à « COMPLET ».
# Ce workflow ne fait AUCUNE recherche : il ne fait que télécharger et vérifier la couverture.
name: nelyqor-donnees

on:
  workflow_dispatch:
    inputs:
      seed_data_run_id:
        description: "Facultatif (phase 8) : run de nelyqor-export-donnees dont l'artefact remplace le cache, à l'identique (rejeu exact de v3)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: nelyqor-prospective   # jamais en même temps qu'une évaluation (même cache)
  cancel-in-progress: false

defaults:
  run:
    working-directory: nelyqor-trading

env:
  NELYQOR_MARKET_DATA: data/market

jobs:
  prefill:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read     # import ponctuel d'un artefact de données (seed_data_run_id)
    env:
      INPUT_SEED_DATA: ${{ inputs.seed_data_run_id }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: nelyqor-trading/requirements.lock}
      - run: pip install -r requirements.lock
      - uses: actions/cache/restore@v4
        if: env.INPUT_SEED_DATA == ''
        with:
          path: nelyqor-trading/data/market
          key: bitvavo-market-v1-${{ github.run_id }}
          restore-keys: bitvavo-market-v1-
      - name: Import à l'identique d'un cache exporté (seed_data_run_id)
        if: env.INPUT_SEED_DATA != ''
        uses: actions/download-artifact@v4
        with:
          pattern: donnees-marche-*
          path: import
          run-id: ${{ inputs.seed_data_run_id }}
          github-token: ${{ github.token }}
      - name: Vérification de l'empreinte et extraction (aucune modification des bougies)
        if: env.INPUT_SEED_DATA != ''
        run: |
          set -euo pipefail
          d=$(dirname "$(find ../import -name donnees_marche.tar | head -1)")
          [ -n "$d" ] || { echo "artefact donnees_marche.tar introuvable"; exit 1; }
          (cd "$d" && sha256sum -c donnees_marche.tar.sha256)
          rm -rf data/market && mkdir -p data
          tar -C data -xf "$d/donnees_marche.tar"
          echo "## Import du cache exporté" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- run source : $INPUT_SEED_DATA ; sha256 : \`$(cut -d' ' -f1 "$d/donnees_marche.tar.sha256")\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Téléchargement incrémental (1 h, EUR + USDC, 1100 jours, budget 55 min)
        if: env.INPUT_SEED_DATA == ''
        run: |
          set +e
          python scripts/download_candles.py --universe --quotes EUR,USDC --interval 1h --days 1100 --time-budget 3300 --pause 0.02
          echo "code=$?"
          exit 0
      - name: Couverture (COMPLET / INCOMPLET)
        id: couv
        run: |
          python scripts/download_candles.py --report --interval 1h > ../couverture.json
          python - <<'PY'
          import json, time, os
          r = json.load(open("../couverture.json"))
          now = time.time() * 1000
          eur = [x for x in r if x["market"].endswith("-EUR")]
          recents = [x for x in eur if now - x["last_ts"] < 3 * 3600_000]
          old = [x for x in eur if x["first_ts"] < now - 1000 * 86_400_000]
          ok = len(eur) >= 400 and len(recents) >= 0.9 * len(eur)
          msg = (f"marchés EUR {len(eur)} ; à jour (< 3 h) {len(recents)} ; historique ≥ 1000 j {len(old)} ; "
                 f"total {len(r)} ; => {'COMPLET' if ok else 'INCOMPLET : relancer ce workflow'}")
          print(msg)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Pré-remplissage des données\n\n" + msg + "\n")
          PY
          du -sh data/market
      - uses: actions/cache/save@v4
        if: always()
        with: {path: nelyqor-trading/data/market, key: "bitvavo-market-v1-${{ github.run_id }}"}
