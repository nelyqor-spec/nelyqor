# Nelyqor Trading — PHASE 3 : collecte massive (API PUBLIQUE Bitvavo, sans clé) + recherche en parallèle.
# - Aucun secret, aucun ordre, aucun accès à une base de production.
# - Les données sont conservées entre exécutions dans le cache GitHub Actions (téléchargement incrémental) ;
#   elles ne sont jamais commitées. Budget de temps par étape pour rester dans les quotas.
# - Ce workflow n'est PAS un serveur permanent : il calcule à la demande.
name: nelyqor-research

on:
  workflow_dispatch:
    inputs:
      max_markets:
        description: "Nombre max de marchés (EUR+USDC) à collecter en 1 h (0 = tous)"
        default: "0"
  push:
    branches: ["claude/**"]
    paths: ["nelyqor-trading/scripts/research_phase3.py", ".github/workflows/nelyqor-research.yml"]

permissions:
  contents: read

concurrency:
  group: nelyqor-research-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: nelyqor-trading

env:
  NELYQOR_MARKET_DATA: data/market

jobs:
  donnees:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: nelyqor-trading/requirements.lock}
      - run: pip install -r requirements.lock
      - name: Restauration des données déjà collectées
        uses: actions/cache/restore@v4
        with:
          path: nelyqor-trading/data/market
          key: bitvavo-market-v1-${{ github.run_id }}
          restore-keys: bitvavo-market-v1-
      - name: Univers EUR + USDC en 1 h (incrémental, budget 40 min)
        env:
          MAX_MARKETS: ${{ inputs.max_markets || '0' }}
        run: |
          case "$MAX_MARKETS" in ''|*[!0-9]*) echo "::error::max_markets doit être un entier"; exit 1;; esac
          python scripts/download_candles.py --universe --quotes EUR,USDC --interval 1h --days 1100 --max-markets "$MAX_MARKETS" --time-budget 2400 --pause 0.02 || echo "::warning::téléchargement incomplet (code $?)"
      - name: 15 min sur les 30 marchés les plus actifs (budget 12 min)
        run: python scripts/download_candles.py --universe --quotes EUR --interval 15m --days 730 --max-markets 30 --time-budget 720 --pause 0.02 || echo "code=$?"
      - name: 4 h natif sur 5 marchés (contrôle de l'agrégation causale)
        run: python scripts/download_candles.py --markets BTC-EUR,ETH-EUR,SOL-EUR,XRP-EUR,ADA-EUR --interval 4h --days 1100 || echo "code=$?"
      - name: Instantané réel des carnets (spreads, profondeur, EUR et USDC)
        run: python scripts/market_snapshot.py --out data/snapshots --depth-markets 60
      - name: Couverture
        run: |
          python scripts/download_candles.py --report --interval 1h > couverture_1h.json
          python -c "import json;r=json.load(open('couverture_1h.json'));print('marches_1h',len(r),'eur',sum(x['market'].endswith('-EUR') for x in r),'usdc',sum(x['market'].endswith('-USDC') for x in r),'bougies',sum(x['rows'] for x in r))"
          du -sh data/market
      - name: Sauvegarde des données (cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: nelyqor-trading/data/market
          key: bitvavo-market-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with: {name: instantanes-carnets, path: nelyqor-trading/data/snapshots, retention-days: 30}

  recherche:
    needs: donnees
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {part: xs, intervals: "1h,2h,4h,8h,12h,1d"}
          - {part: exec, intervals: "1h,4h,1d"}
          - {part: strat, intervals: "4h,8h,12h,1d"}
          - {part: strat, intervals: "1h,2h"}
          - {part: models, intervals: "4h"}
          - {part: venue, intervals: "1h"}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: nelyqor-trading/requirements.lock}
      - run: pip install -r requirements.lock
      - uses: actions/cache/restore@v4
        with:
          path: nelyqor-trading/data/market
          key: bitvavo-market-v1-${{ github.run_id }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with: {name: instantanes-carnets, path: nelyqor-trading/data/snapshots}
      - name: Recherche (${{ matrix.part }} ${{ matrix.intervals }})
        run: python scripts/research_phase3.py --part ${{ matrix.part }} --intervals ${{ matrix.intervals }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "phase3-${{ matrix.part }}-${{ strategy.job-index }}", path: nelyqor-trading/reports-ci, retention-days: 30}
