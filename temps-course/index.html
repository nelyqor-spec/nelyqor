<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F1720">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Temps Course">
  <title>Temps Course</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <style>
    :root { --bg:#0F1720; --card:#161F2B; --teal:#2ED3B7; --blue:#78A6FF; --txt:#F5F7FA; --muted:#8A97A8; --red:#FF6B6B; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--txt);
      font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px); }
    main { max-width:480px; margin:0 auto; }
    h1 { font-size:24px; margin:0 0 4px; }
    .muted { color:var(--muted); }
    .small { font-size:13px; }
    .big { display:block; text-align:center; background:var(--teal); color:#0F1720; font-weight:700;
      font-size:20px; padding:22px; border-radius:18px; margin:18px 0 10px; cursor:pointer; }
    .big:active { opacity:.8; }
    .card { background:var(--card); border-radius:18px; padding:18px; margin:14px 0; }
    .total { font-size:44px; font-weight:800; line-height:1; }
    .perh { font-size:20px; font-weight:700; margin-top:6px; }
    .good { color:var(--teal); } .bad { color:var(--red); } .mid { color:var(--blue); }
    .legs div { display:flex; justify-content:space-between; padding:9px 0; border-top:1px solid #223042; }
    .legs div:first-child { margin-top:14px; }
    label.row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; }
    input[type=number] { width:70px; background:var(--bg); color:var(--txt); border:1px solid #2A3A4F;
      border-radius:10px; padding:8px; font-size:16px; text-align:center; }
    button.link { background:none; border:none; color:var(--blue); font-size:15px; padding:8px 0; }
    pre { white-space:pre-wrap; font-size:12px; }
    #status { min-height:22px; text-align:center; }
  </style>
</head>
<body>
<main>
  <h1>Temps Course 🚗</h1>
  <div id="gps" class="muted small">📍 Recherche de ta position…</div>

  <label class="big" for="file">📸 Analyser une capture</label>
  <input id="file" type="file" accept="image/*" hidden>
  <div id="status" class="muted small"></div>

  <section id="result" class="card" hidden>
    <div class="total" id="total"></div>
    <div class="perh" id="perh"></div>
    <div class="legs">
      <div><span>🍔 Jusqu'au resto</span><b id="leg1"></b></div>
      <div><span>⏳ Attente au resto</span><b id="legw"></b></div>
      <div><span>🏠 Resto → client</span><b id="leg2"></b></div>
    </div>
    <div class="muted small" id="detail" style="margin-top:10px"></div>
  </section>

  <section class="card">
    <label class="row">Attente moyenne au resto
      <span><input id="wait" type="number" min="0" max="30" inputmode="numeric"> min</span></label>
    <label class="row">Objectif (€/h)
      <span><input id="goal" type="number" min="0" max="100" inputmode="decimal"> €</span></label>
  </section>

  <button id="demo" class="link">Tester avec l'exemple Pizza Cosy</button>
  <details class="muted small"><summary>Texte lu sur la capture</summary><pre id="raw"></pre></details>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
const status = t => { $('status').textContent = t; };

// ---------- Réglages ----------
$('wait').value = store.get('wait', '5');
$('goal').value = store.get('goal', '15');
$('wait').onchange = e => store.set('wait', e.target.value);
$('goal').onchange = e => store.set('goal', e.target.value);

// ---------- Position ----------
let here = null;
if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(
    p => { here = { lat: p.coords.latitude, lon: p.coords.longitude, t: Date.now() }; $('gps').textContent = '📍 Position OK'; },
    () => { $('gps').textContent = '📍 Position refusée : active-la pour avoir le temps jusqu\'au resto'; },
    { enableHighAccuracy: true, maximumAge: 30000 }
  );
}
const freshHere = () => (here && Date.now() - here.t < 10 * 60 * 1000) ? here : null;

// ---------- Lecture du texte (préchargée au démarrage) ----------
const workerP = Tesseract.createWorker('fra');

$('file').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  $('result').hidden = true;
  try {
    status('Lecture de la capture…');
    const lines = await ocr(f);
    $('raw').textContent = lines.map(l => l.text).join('\n');
    const offer = parseOffer(lines.map(l => l.text));
    if (!offer) { status('Offre non reconnue. Ouvre « Texte lu sur la capture » en bas.'); return; }
    await analyze(offer);
  } catch (err) {
    status('Erreur : ' + err.message);
  }
};

$('demo').onclick = () => analyze(parseOffer([
  'Livraison Exclusivité', '4,60 €', '0.9 km', 'Pizza Cosy - Aix en Provence',
  '230 Av. de Bagatelle, 13090, Aix-en-', 'Provence', 'Accepter'
])).catch(err => status('Erreur : ' + err.message));

function loadImage(file) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('image illisible'));
    i.src = URL.createObjectURL(file);
  });
}

async function ocr(file) {
  const img = await loadImage(file);
  // On ne garde que le bas de l'écran (la carte de l'offre), réduit pour aller vite.
  const top = Math.round(img.height * 0.45);
  const scale = Math.min(1, 1000 / img.width);
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * scale);
  c.height = Math.round((img.height - top) * scale);
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, top, img.width, img.height - top, 0, 0, c.width, c.height);

  // Gris + inversion si fond sombre (texte blanc → texte noir, mieux lu).
  const d = ctx.getImageData(0, 0, c.width, c.height), px = d.data;
  let sum = 0;
  for (let i = 0; i < px.length; i += 4) {
    const g = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
    px[i] = px[i + 1] = px[i + 2] = g; sum += g;
  }
  if (sum / (px.length / 4) < 128) for (let i = 0; i < px.length; i += 4) px[i] = px[i + 1] = px[i + 2] = 255 - px[i];
  ctx.putImageData(d, 0, 0);

  const worker = await workerP;
  const { data } = await worker.recognize(c);
  return (data.lines || [])
    .map(l => ({ text: l.text.trim(), x: (l.bbox.x0 + l.bbox.x1) / 2 / c.width, y: l.bbox.y0 }))
    .filter(l => l.text && l.x > 0.08 && l.x < 0.92)   // ignore les bords de la carte
    .sort((a, b) => a.y - b.y);
}

// ---------- Lecture de l'offre Uber Eats ----------
//  4,60 € / 0.9 km / Pizza Cosy - Aix en Provence / 230 Av. de Bagatelle, 13090, Aix-en- / Provence / Accepter
function parseOffer(raw) {
  const lines = raw
    .map(s => s.trim().replace(/^[oO0°©®□|Dd]\s+(?=\S)/, ''))  // retire les petites icônes lues comme lettres
    .filter(Boolean);
  const acceptIdx = lines.findLastIndex(l => /accepter/i.test(l));
  if (acceptIdx < 0) return null;
  const priceIdx = lines.slice(0, acceptIdx).findLastIndex(l => /€/.test(l) || /^\d+[,.]\d{2}\s*[eE]?$/.test(l));
  if (priceIdx < 0) return null;

  const num = s => { const m = s.match(/\d+([.,]\d+)?/); return m ? parseFloat(m[0].replace(',', '.')) : null; };
  const price = num(lines[priceIdx]);
  let block = lines.slice(priceIdx + 1, acceptIdx);
  let km = null;
  const kmIdx = block.findIndex(l => /\d\s*km\b/i.test(l));
  if (kmIdx >= 0) { km = num(block[kmIdx]); block = block.slice(kmIdx + 1); }
  block = block.filter(l => l.length > 2 && !/^\d+([.,]\d+)?\s*(km|min|m)\b/i.test(l));  // retire "12 min" et bouts de carte
  if (block.length < 2) return null;

  let client = '';
  for (const l of block.slice(1)) client += client.endsWith('-') ? l : (client ? ' ' : '') + l;
  return { price, km, restaurant: block[0], client };
}

// ---------- Adresses et trajets (gratuit, sans clé) ----------
function distM(a, b) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLon = r(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

async function geocode(q, near) {
  const u = new URL('https://photon.komoot.io/api/');
  u.searchParams.set('q', q);
  u.searchParams.set('limit', '1');
  u.searchParams.set('lang', 'fr');
  if (near) { u.searchParams.set('lat', near.lat); u.searchParams.set('lon', near.lon); }
  const r = await fetch(u);
  if (!r.ok) return null;
  const f = (await r.json()).features?.[0];
  if (!f) return null;
  const [lon, lat] = f.geometry.coordinates;
  if (near && distM(near, { lat, lon }) > 30000) return null;   // trop loin = mauvais résultat
  return { lat, lon };
}

async function route(points) {
  const coords = points.map(p => p.lon.toFixed(6) + ',' + p.lat.toFixed(6)).join(';');
  const r = await fetch('https://router.project-osrm.org/route/v1/driving/' + coords + '?overview=false');
  const j = await r.json();
  if (j.code !== 'Ok') throw new Error('itinéraire impossible');
  return j.routes[0].legs.map(l => l.duration);
}

const fmt = s => Math.max(1, Math.round(s / 60)) + ' min';

async function analyze(offer) {
  if (!offer) { status('Offre non reconnue.'); return; }
  status('Calcul des trajets…');
  const me = freshHere();
  const wait = (parseFloat($('wait').value) || 0) * 60;

  const client = await geocode(offer.client, me);
  if (!client) throw new Error('adresse client introuvable : ' + offer.client);

  let resto = await geocode(offer.restaurant, client)
           || await geocode(offer.restaurant.split(' - ')[0], client);
  let note = '';
  if (!resto) {
    // Resto pas trouvé : on prend le client comme repère (les deux sont proches).
    resto = client;
    note = 'Resto introuvable sur la carte : temps approximatifs. ';
  }

  const legs = await route(me ? [me, resto, client] : [resto, client]);
  const toResto = me ? legs[0] : null;
  let restoClient = me ? legs[1] : legs[0];
  if (resto === client && offer.km) restoClient = offer.km * 1000 / (30000 / 3600); // ~30 km/h en ville

  const total = (toResto || 0) + wait + restoClient;
  const perHour = offer.price && total ? offer.price / (total / 3600) : null;
  const goal = parseFloat($('goal').value) || 0;

  $('total').textContent = '⏱ ' + fmt(total);
  $('perh').textContent = perHour
    ? (offer.price.toFixed(2).replace('.', ',') + ' € → ' + perHour.toFixed(1).replace('.', ',') + ' €/h') : '';
  $('perh').className = 'perh ' + (!perHour || !goal ? '' : perHour >= goal ? 'good' : perHour >= goal * 0.75 ? 'mid' : 'bad');
  $('leg1').textContent = toResto !== null ? fmt(toResto) : 'position inconnue';
  $('legw').textContent = wait ? fmt(wait) : '—';
  $('leg2').textContent = fmt(restoClient);
  $('detail').textContent = note + offer.restaurant + ' → ' + offer.client + ' · sans trafic';
  $('result').hidden = false;
  status('');
}

// ---------- Ouverture depuis le raccourci : ?t=texte lu sur l'écran ----------
const sharedText = new URLSearchParams(location.search).get('t');
if (sharedText) {
  $('raw').textContent = sharedText;
  history.replaceState(null, '', location.pathname);
  (async () => {
    status('Recherche de ta position…');
    for (let i = 0; i < 20 && !freshHere(); i++) await new Promise(r => setTimeout(r, 200));
    const offer = parseOffer(sharedText.split(/\r?\n/));
    if (!offer) { status('Offre non reconnue. Ouvre « Texte lu sur la capture » en bas.'); return; }
    await analyze(offer);
  })().catch(err => status('Erreur : ' + err.message));
}
</script>
</body>
</html>
