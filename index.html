<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- S'adapte à la largeur de l'appareil, occupe tout l'écran (encoche comprise) et empêche le zoom
       automatique qui « bloquait » l'app agrandie au démarrage ou après la saisie d'un champ. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; manifest-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#0F1720">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Nelyqor t’aide à suivre tes revenus et à progresser vers tes objectifs financiers.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nelyqor">
  <title>Nelyqor</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"></div>
  <noscript><p style="padding:24px;color:#F5F7FA">Nelyqor a besoin de JavaScript pour fonctionner.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
