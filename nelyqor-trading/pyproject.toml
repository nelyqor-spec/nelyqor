[project]
name = "nelyqor-trading"
version = "0.1.0"
description = "Système personnel de trading algorithmique spot Bitvavo (simulation par défaut)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "websockets>=13",
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "pydantic>=2.7",
]

[project.optional-dependencies]
ml = ["lightgbm>=4.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008", "E501", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
packages = ["backend"]
