<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nelyqor">
  <meta name="format-detection" content="telephone=no">
  <meta name="referrer" content="no-referrer">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
  <title>Nelyqor Trading</title>
</head>
<body>
  <header id="top" class="top">
    <div id="mode" class="mode" role="status" aria-live="polite"></div>
    <div id="banner" class="banner" role="alert"></div>
  </header>
  <main id="view" class="view"></main>
  <nav id="tabs" class="tabs" hidden>
    <button data-tab="accueil" class="on"><span>◉</span>Accueil</button>
    <button data-tab="marches"><span>≋</span>Marchés</button>
    <button data-tab="ia"><span>✶</span>IA</button>
    <button data-tab="capital"><span>€</span>Capital</button>
    <button data-tab="reglages"><span>⚙</span>Réglages</button>
    <button id="fab-stop" class="tab-stop" type="button" aria-label="Arrêt d'urgence"><span>■</span>STOP</button>
  </nav>
  <div id="sheet" class="sheet" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
